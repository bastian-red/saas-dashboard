# The datastores are always on; the application services live behind the `app`
# profile so `docker compose up -d` gives you what `pnpm dev` needs and nothing
# else.
#
#   docker compose -f infra/docker-compose.yml up -d              # postgres + redis
#   docker compose -f infra/docker-compose.yml --profile app up -d --build

# Explicit, and not optional. Without it Compose derives the project name from the
# containing directory, which is `infra` in every project in this portfolio, and
# bringing up a second stack evicts the first one's containers AND its volumes.
name: saas

services:
  postgres:
    image: postgres:16-alpine
    container_name: saas-postgres
    # A smaller WAL ceiling than the 1 GB default: the scale test writes millions
    # of rows, and a full Docker disk crashes the server mid-test (project009
    # learned this). 128 MB only means more frequent checkpoints; min_wal_size
    # lets the server hand recycled segments back instead of keeping 80 MB.
    command: ['postgres', '-c', 'max_wal_size=128MB', '-c', 'min_wal_size=32MB']
    environment:
      # The OWNER role: migrations run as it. The services never do; they log in
      # as saas_app, which the migrations create without the right to bypass
      # row-level security and which owns no table.
      POSTGRES_USER: saas_owner
      POSTGRES_PASSWORD: saas_owner
      POSTGRES_DB: saas
    # 5432 is the dev host's own PostgreSQL and 5433-5442 belong to the sibling
    # portfolio stacks, so this project takes 5443.
    ports:
      - '5443:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saas_owner -d saas']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: saas-redis
    # Quota counters and rate-limit windows live here, and a lost quota counter
    # would hand every tenant a fresh month, so append-only persistence is on.
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '6389:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- The whole stack: docker compose -f infra/docker-compose.yml --profile app up --build
  #
  # Every service logs in to Postgres as saas_app, the role that owns no table
  # and cannot bypass row-level security. Only `migrate` uses the owner, to run
  # the migrations, set saas_app's password from DATABASE_URL, and seed the demo.

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      target: build
    image: saas-migrate
    container_name: saas-migrate
    profiles: ['app']
    env_file:
      - ../.env
    environment: &datastores
      DATABASE_URL: postgresql://saas_app:saas_app_dev_password@postgres:5432/saas?schema=public
      DIRECT_DATABASE_URL: postgresql://saas_owner:saas_owner@postgres:5432/saas?schema=public
      REDIS_URL: redis://redis:6379
    command: ['sh', '-c', 'pnpm --filter @saas/db run migrate:deploy && pnpm --filter @saas/db run seed']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ingest:
    build:
      context: ..
      dockerfile: infra/Dockerfile.ingest
    image: saas-ingest
    container_name: saas-ingest
    profiles: ['app']
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: *datastores
      INGEST_PORT: '4200'
    ports:
      - '4200:4200'
    depends_on:
      migrate:
        condition: service_completed_successfully

  aggregator:
    build:
      context: ..
      dockerfile: infra/Dockerfile.aggregator
    image: saas-aggregator
    container_name: saas-aggregator
    profiles: ['app']
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: *datastores
      AGGREGATOR_HEALTH_PORT: '4300'
    ports:
      - '4300:4300'
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: saas-api
    container_name: saas-api
    profiles: ['app']
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: *datastores
      PORT: ''
      API_PORT: '4000'
      INGEST_INTERNAL_URL: http://ingest:4200
      AGGREGATOR_INTERNAL_URL: http://aggregator:4300
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    image: saas-web
    container_name: saas-web
    profiles: ['app']
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: '3000'
      API_BASE_URL: http://api:4000
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
