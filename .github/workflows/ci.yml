name: CI

# One job per lane. Each proves something the others cannot: the unit lane
# cannot see turbo stripping the environment, the e2e lane supplies its own
# environment and so cannot see it either, only dev-smoke boots the documented
# `pnpm dev`, only integration runs as the RLS-bound role against real
# Postgres, and only the load lane measures ingest under traffic.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The datastores every lane but quality and unit needs. Postgres runs as the
# OWNER role (saas_owner); the migrations create saas_app, and
# scripts/db-app-role.mjs gives it the password in DATABASE_URL.
env:
  DATABASE_URL: postgresql://saas_app:saas_app_dev_password@localhost:5443/saas?schema=public
  DIRECT_DATABASE_URL: postgresql://saas_owner:saas_owner@localhost:5443/saas?schema=public
  REDIS_URL: redis://localhost:6389

jobs:
  quality:
    name: Lint, typecheck, contracts, secrets, format, audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so gitleaks scans every commit and not just the tip.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Self-tests first: a checker that has silently stopped checking passes
      # everything, and only a check on the checker can see that.
      - run: pnpm env:contract:self-test
      - run: pnpm env:contract
      - run: pnpm scan:invisible:self-test
      - run: pnpm scan:invisible
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: pnpm run scan:secrets
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec prettier --check "**/*.{ts,tsx,js,cjs,mjs,json}"
      # Runtime dependencies only, and only critical: a critical advisory in
      # anything that ships fails the build (next <=16.4.0 had two RCEs).
      - run: pnpm audit --prod --audit-level critical

  unit:
    name: Unit and design gates (UTC and Pacific/Kiritimati)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test
      # Twice, the second time at UTC+14: a formatter or an hour bucket that
      # assumed UTC passes the first run and fails here.
      - run: pnpm test
        env:
          TZ: Pacific/Kiritimati

  integration:
    name: Integration (RLS as saas_app, isolation matrix, quota, billing, 13M-event scale, seed)
    runs-on: ubuntu-24.04
    env:
      AUTH_SECRET: ci-secret-at-least-32-characters-long
      BILLING_MOCK_SECRET: ci-billing-mock-secret-32-chars-x
    services:
      postgres: &postgres
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saas_owner
          POSTGRES_PASSWORD: saas_owner
          POSTGRES_DB: saas
        ports: ['5443:5432']
        options: >-
          --health-cmd "pg_isready -U saas_owner -d saas"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis: &redis
        image: redis:7-alpine
        ports: ['6389:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: ./scripts/db-drift.sh
      - run: ./scripts/seed-check.sh
      - run: ./scripts/integration.sh

  loadtest:
    name: Ingest load (2,000 events/s, zero loss, noisy neighbour)
    runs-on: ubuntu-24.04
    env:
      AUTH_SECRET: ci-secret-at-least-32-characters-long
      BILLING_MOCK_SECRET: ci-billing-mock-secret-32-chars-x
      # Shared runners are noisy neighbours of their own; the local budget
      # (50 ms) is the README's number, this one catches an order-of-magnitude
      # regression. Both are printed in the report.
      LOADTEST_P99_MS: '150'
    services:
      postgres: *postgres
      redis: *redis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: ./scripts/loadtest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-results
          path: /tmp/saas-loadtest
          retention-days: 14

  dev-smoke:
    # Deliberately NO job-level datastore env reaching the app: the point of
    # this job is that the only configuration reaching the processes is the
    # .env file, through scripts/dev.sh, the way it does on a reader's machine.
    # (The workflow-level env is stripped by dev-smoke.sh's `env -u`.)
    name: pnpm dev serves all four processes
    runs-on: ubuntu-24.04
    services:
      postgres: *postgres
      redis: *redis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up .env the way the README says
        run: |
          cp .env.example .env
          sed -i "s|^AUTH_SECRET=|AUTH_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^BILLING_MOCK_SECRET=|BILLING_MOCK_SECRET=$(openssl rand -base64 32)|" .env
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      # Cold runner, nothing built: dev's ^build dependency has to do it all.
      - run: WAIT_SECONDS=300 ./scripts/dev-smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dev-smoke-log
          path: /tmp/saas-dev-smoke.log
          retention-days: 7

  e2e:
    name: E2E (Playwright, Chromium + Firefox, axe in both schemes incl. a branded tenant)
    runs-on: ubuntu-24.04
    services:
      postgres: *postgres
      redis: *redis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @saas/e2e exec playwright install --with-deps chromium firefox
      - run: ./scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

  images:
    name: Docker images build (api, web, ingest, aggregator)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, ingest, aggregator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
